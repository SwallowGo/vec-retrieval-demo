spring:
  application:
    name: vector-search
  datasource:
    # H2 文件持久化模式：数据落在 ./data/vectordb.mv.db，重启保留
    # AUTO_SERVER：允许应用运行期间用外部工具（如 H2 Console）同时连接
    url: jdbc:h2:file:./data/vectordb;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      # 建表完全由 schema.sql 负责（题目要求 DDL 随项目提供、启动自动建表）
      ddl-auto: none
    open-in-view: false
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080

logging:
  level:
    com.twelvetimers.vector: info
