spring:
  application:
    name: vector-search
  datasource:
    # H2 文件持久化模式：数据落在 ./data/vectordb.mv.db，重启保留
    # AUTO_SERVER：允许应用运行期间用外部工具（如 H2 Console）同时连接
    url: jdbc:h2:file:./data/vectordb;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      # 建表完全由 schema.sql 负责（题目要求 DDL 随项目提供、启动自动建表）
      ddl-auto: none
    open-in-view: false
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080

# 向量化异步引擎配置
vector:
  embedding:
    workers: 4                # 工作线程数（CPU 密集）
    queue-capacity: 1024      # 有界队列容量（队满即拒绝，背压保护）
    busy-rounds: 20000        # 模拟 CPU 耗时的哈希迭代轮数
    simulated-delay-ms: 100   # 模拟外部 Embedding API 延迟（毫秒）

logging:
  level:
    com.twelvetimers.vector: info
